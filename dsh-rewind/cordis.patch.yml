# 对话回滚 bundle 的 patch 层：插入本包唯一的 Host 行。
# config 没有 Config schema 校验，Host 半会自己兜默认值：
#   root              快照落盘根，默认 $DSH_HOME/rewind
#   restoreFiles      回滚时是否同时还原工作区文件，默认 true
#   keepMessage       默认 false（连同目标消息一起撤回）；true 则上下文停在「这条消息刚发出」
#   maxPoints         每会话保留多少个回滚点，默认 40
#   maxFileBytes      单文件入快照的大小上限，默认 2 MiB
#   maxFiles          单次快照最多收录的文件数，默认 20000
#   maxSnapshotBytes  单次快照最多收录的字节数，默认 256 MiB
#   ignoreDirs        快照不覆盖的目录名（如 node_modules），默认见 index.js
- insert:
    - id: rewind
      name: '@local/dsh-rewind'
      config:
        restoreFiles: true
        keepMessage: false
        maxPoints: 40
